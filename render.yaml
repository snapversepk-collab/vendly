# Render Blueprint: backend API only. The database lives on Neon (free Postgres, doesn't expire).
# Render dashboard → New → Blueprint → pick this repo, then fill the env vars marked sync:false.
services:
  - type: web
    name: vendly-api
    runtime: node
    rootDir: backend
    region: singapore        # closest Render region to Pakistan
    plan: free               # sleeps after 15 min idle; the cron ping in the README keeps it awake
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon → your project → Connect → copy the connection string
      # (postgresql://user:password@ep-xxxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: APP_NAME
        value: Vendly
      # Your Vercel URL, e.g. https://vendly.vercel.app (comma-separate several; preview URLs of
      # the same Vercel project are allowed automatically)
      - key: FRONTEND_URL
        sync: false
      # Optional: Resend API key + a sender on a domain you verified in Resend (SPF/DKIM/DMARC)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Optional: Google sign-in (OAuth Web client ID; add your Vercel URL as an authorised origin)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FREE_BOOKINGS_PER_MONTH
        value: "10"
      - key: PRO_PRICE
        value: "2500"
      - key: TEAM_PRICE
        value: "5000"
