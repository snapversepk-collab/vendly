# Render Blueprint: backend API + Postgres database.
# Render dashboard → New → Blueprint → pick this repo. Then fill the env vars marked sync:false.
databases:
  - name: vendly-db
    databaseName: vendly
    user: vendly
    region: singapore        # closest Render region to Pakistan
    # NOTE: free Render Postgres expires 30 days after creation. Switch to a paid plan
    # (e.g. basic-256mb) before real vendors put bookings in it.
    plan: free

services:
  - type: web
    name: vendly-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free               # free instances sleep after 15 min idle; see README "Scheduled emails"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vendly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: APP_NAME
        value: Vendly
      # Your Vercel URL, e.g. https://vendly.vercel.app (comma-separate several; preview URLs of
      # the same Vercel project are allowed automatically)
      - key: FRONTEND_URL
        sync: false
      # Optional: Resend API key + a sender on a domain you verified in Resend (SPF/DKIM/DMARC)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Optional: Google sign-in (OAuth Web client ID; add your Vercel URL as an authorised origin)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FREE_BOOKINGS_PER_MONTH
        value: "10"
      - key: PRO_PRICE
        value: "2500"
      - key: TEAM_PRICE
        value: "5000"
