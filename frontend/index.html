<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E0D" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Booking software for event vendors in Pakistan: inquiries, quotes, advances and checklists." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Vendly</title>
    <script>
      // Apply saved appearance before first paint to avoid a flash
      try { var a = localStorage.getItem('appearance'); if (a === 'light' || a === 'dark') document.documentElement.dataset.theme = a; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
